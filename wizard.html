<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4t-wizard</title>

  <script type="importmap">
  { "imports": { "vue": "https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.prod.js" } }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      background: #f0f2f5;
      color: #1a1a1a;
      height: 100vh;
      overflow: hidden;
      margin: 0;
    }

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */

    #header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #1e2130;
      color: #e2e8f0;
      border-bottom: 1px solid #2e3348;
    }

    #header .title {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.3px;
      margin-right: 8px;
    }

    #header .sep { flex: 1; }

    .hbtn {
      padding: 4px 10px;
      border: 1px solid #3a3f55;
      border-radius: 5px;
      background: transparent;
      color: #c8d0e0;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .hbtn:hover:not(:disabled) { background: #2a2f45; color: #fff; }
    .hbtn:disabled { opacity: 0.35; cursor: default; }
    .hbtn.active   { background: #3a4060; color: #fff; }

    .error-msg {
      font-size: 12px;
      color: #ff6b6b;
      padding: 0 8px;
    }

    /* ── Preview ─────────────────────────────────────────────────────────────── */

    #preview-section {
      flex: 0 0 40vh;
      background: #fff;
      border-bottom: 2px solid #d0d5df;
      overflow: hidden;
    }

    #preview { width: 100%; height: 100%; }

    /* ── Editor ──────────────────────────────────────────────────────────────── */

    #editor-section {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 16px;
    }

    .panel-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      margin-bottom: 12px;
    }

    .panel-placeholder {
      padding: 32px;
      text-align: center;
      color: #aaa;
      border: 2px dashed #ddd;
      border-radius: 6px;
    }

    /* ── Overlays ────────────────────────────────────────────────────────────── */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: #fff;
      border-radius: 8px;
      padding: 28px 32px;
      min-width: 360px;
      max-width: 480px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    }

    .modal h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .modal p {
      color: #555;
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      padding: 9px 16px;
      border-radius: 6px;
      border: 1px solid #d0d0d0;
      background: #f5f5f5;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }
    .btn:hover { background: #e8e8e8; }
    .btn.primary { background: #1e2130; color: #fff; border-color: #1e2130; }
    .btn.primary:hover { background: #2a2f45; }

    .form-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .form-row label { font-size: 13px; color: #444; min-width: 120px; }
    .form-row input[type="number"] {
      width: 80px;
      padding: 5px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    /* ── JSON drawer ─────────────────────────────────────────────────────────── */

    #json-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 420px;
      height: 100vh;
      background: #1a1d2e;
      color: #c8d8f0;
      display: flex;
      flex-direction: column;
      z-index: 90;
      box-shadow: -4px 0 20px rgba(0,0,0,0.3);
      transform: translateX(100%);
      transition: transform 0.2s ease;
    }

    #json-drawer.open { transform: translateX(0); }

    #json-drawer .drawer-header {
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #7a8aaa;
      border-bottom: 1px solid #2e3348;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #json-drawer pre {
      flex: 1;
      overflow: auto;
      padding: 14px;
      font-family: 'Fira Mono', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre;
    }

    #json-drawer .drawer-footer {
      padding: 10px 14px;
      border-top: 1px solid #2e3348;
    }

    #json-drawer .copy-btn {
      width: 100%;
      padding: 8px;
      background: #2a2f45;
      border: 1px solid #3a3f55;
      border-radius: 5px;
      color: #c8d0e0;
      font-size: 13px;
      cursor: pointer;
    }
    #json-drawer .copy-btn:hover { background: #363c58; }
    #json-drawer .copy-btn.copied { color: #6ee7b7; border-color: #6ee7b7; }

    /* ── Panel toolbar ───────────────────────────────────────────────────────── */

    .panel-toolbar { display: flex; gap: 8px; margin-bottom: 12px; }

    .btn-tool {
      padding: 5px 12px;
      border: 1px solid #c8d0dc;
      border-radius: 5px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-tool:hover { background: #f0f4f8; }

    .panel-empty {
      padding: 32px;
      text-align: center;
      color: #aaa;
      border: 2px dashed #e0e4ea;
      border-radius: 6px;
      font-size: 13px;
    }

    /* ── Accordion ───────────────────────────────────────────────────────────── */

    .acc-row { border: 1px solid #dde1e8; border-radius: 6px; margin-bottom: 6px; overflow: hidden; }

    .acc-header {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px; cursor: pointer; user-select: none; background: #f6f8fa;
    }
    .acc-header:hover { background: #edf0f5; }
    .acc-header.open  { background: #e8edf5; }

    .acc-arrow { font-size: 10px; color: #888; width: 12px; flex-shrink: 0; }
    .color-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); flex-shrink: 0; }
    .acc-label { flex: 1; font-weight: 500; font-size: 13px; }
    .acc-badge { font-size: 11px; color: #aaa; font-style: italic; }

    .icon-btn {
      padding: 2px 7px; border: 1px solid #dde1e8; border-radius: 4px;
      background: #fff; font-size: 12px; cursor: pointer; line-height: 1.4;
    }
    .icon-btn:hover:not(:disabled) { background: #f0f4f8; }
    .icon-btn:disabled { opacity: 0.25; cursor: default; }
    .icon-btn.danger:hover { background: #fff0f0; border-color: #f5c6c6; color: #c33; }

    .acc-body { padding: 14px 16px; border-top: 1px solid #dde1e8; background: #fff; }

    /* ── Form ────────────────────────────────────────────────────────────────── */

    .form-section { margin-bottom: 16px; }

    .form-section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: #9aa; margin-bottom: 8px;
    }

    .field-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .field-row label { font-size: 12px; color: #555; min-width: 72px; flex-shrink: 0; }

    .field-row input[type="text"],
    .field-row select {
      flex: 1; padding: 4px 8px; border: 1px solid #ccd0d8;
      border-radius: 4px; font-size: 13px; font-family: inherit;
    }
    .field-row textarea {
      flex: 1; padding: 4px 8px; border: 1px solid #ccd0d8;
      border-radius: 4px; font-size: 13px; font-family: inherit;
      resize: vertical; min-height: 52px;
    }

    .field-section { border-left: 3px solid #e8ecf2; padding-left: 10px; margin-bottom: 10px; }

    .field-toggle-row {
      display: flex; align-items: center; gap: 6px; margin-bottom: 6px; cursor: pointer;
    }
    .field-toggle-row input[type="checkbox"] { cursor: pointer; }
    .toggle-label { font-size: 12px; font-weight: 500; color: #444; }

    .field-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; color: #333; }

    /* ── Controls ────────────────────────────────────────────────────────────── */

    .color-picker-wrap { display: flex; align-items: center; gap: 6px; }
    .color-picker-wrap input[type="color"] {
      width: 36px; height: 28px; padding: 1px;
      border: 1px solid #ccd0d8; border-radius: 4px; cursor: pointer;
    }
    .hex-label { font-size: 11px; color: #666; font-family: monospace; }

    .slider-wrap { display: flex; align-items: center; gap: 8px; flex: 1; }
    .slider-wrap input[type="range"] { flex: 1; }
    .range-label { font-size: 12px; color: #666; min-width: 160px; white-space: nowrap; }

    /* ── Timeline / Tools table ──────────────────────────────────────────────── */

    .hint-text { font-size: 12px; color: #999; }
    .hint-text code { font-family: monospace; background: #f0f0f0; padding: 1px 5px; border-radius: 3px; }

    .tl-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tl-table th { text-align: left; padding: 5px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #999; border-bottom: 1px solid #e5e7eb; }
    .tl-table td { padding: 5px 6px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    .tl-table tr:last-child td { border-bottom: none; }

    .tl-input { width: 100%; padding: 3px 7px; border: 1px solid #ccd0d8; border-radius: 4px; font-size: 13px; font-family: inherit; }
    .tl-ann-cell { display: flex; gap: 4px; align-items: center; }
    .btn-tool-sm { padding: 2px 8px; border: 1px solid #c8d0dc; border-radius: 4px; background: #fff; font-size: 12px; cursor: pointer; color: #666; }
    .btn-tool-sm:hover { background: #f0f4f8; }

    .snap-period-input { padding: 2px 6px; border: 1px solid #ccd0d8; border-radius: 4px; font-size: 13px; font-family: monospace; width: 120px; }

    .acc-row.highlighted > .acc-header { background: #fffbeb; border-left: 3px solid #f59e0b; }
    .highlight-badge { color: #d97706; font-weight: 600; }
  </style>
</head>
<body>

<div id="app">

  <!-- ── Start dialog ───────────────────────────────────────────────────────── -->
  <div class="overlay" v-if="showDialog">
    <div class="modal">
      <h2>Resume session?</h2>
      <p>A saved session was found in your browser. What would you like to do?</p>
      <div class="modal-actions">
        <button class="btn primary" @click="dialogResume">Resume last session</button>
        <button class="btn" @click="dialogOpen">Open file…</button>
        <button class="btn" @click="dialogNew">Start with empty canvas</button>
      </div>
    </div>
  </div>

  <!-- ── Settings modal ────────────────────────────────────────────────────── -->
  <div class="overlay" v-if="showSettings" @click.self="showSettings = false">
    <div class="modal">
      <h2>Settings</h2>
      <div class="form-row">
        <label>Undo stack depth</label>
        <input type="number" v-model="settingsForm.undoDepth" min="1" max="200">
      </div>
      <div class="modal-footer">
        <button class="btn" @click="showSettings = false">Cancel</button>
        <button class="btn primary" @click="saveSettingsForm">Save</button>
      </div>
    </div>
  </div>

  <!-- ── JSON drawer ────────────────────────────────────────────────────────── -->
  <div id="json-drawer" :class="{ open: showJsonDrawer }">
    <div class="drawer-header">
      <span>JSON — {{ activeNav.trackId ?? 'manifest' }}</span>
      <button class="hbtn" @click="showJsonDrawer = false">✕</button>
    </div>
    <pre>{{ jsonPreview }}</pre>
    <div class="drawer-footer">
      <button class="copy-btn" :class="{ copied: copyFeedback }" @click="copyJson">
        {{ copyFeedback ? 'Copied!' : 'Copy to clipboard' }}
      </button>
    </div>
  </div>

  <!-- ── Header ─────────────────────────────────────────────────────────────── -->
  <div id="header">
    <span class="title">4t-wizard</span>
    <button class="hbtn" @click="handleUndo" :disabled="!canUndo">Undo</button>
    <button class="hbtn" @click="handleRedo" :disabled="!canRedo">Redo</button>
    <span class="sep"></span>
    <span class="error-msg" v-if="loadError">{{ loadError }}</span>
    <button class="hbtn" @click="toggleLang">{{ lang.toUpperCase() }}</button>
    <button class="hbtn" @click="handleOpen">Open</button>
    <button class="hbtn" @click="handleNew">New</button>
    <button class="hbtn" @click="openSettings">Settings</button>
    <button class="hbtn" :class="{ active: showJsonDrawer }" @click="showJsonDrawer = !showJsonDrawer">JSON</button>
  </div>

  <!-- ── Preview ────────────────────────────────────────────────────────────── -->
  <div id="preview-section">
    <div id="preview"></div>
  </div>

  <!-- ── Editor ─────────────────────────────────────────────────────────────── -->
  <div id="editor-section">
    <div class="panel-label">{{ panelLabel }}</div>
    <tracks-panel   v-if="activeNav.panel === 'tracks'"></tracks-panel>
    <threads-panel  v-else-if="activeNav.panel === 'threads'"></threads-panel>
    <timeline-panel v-else-if="activeNav.panel === 'timeline'"></timeline-panel>
    <tools-panel    v-else-if="activeNav.panel === 'tools'"></tools-panel>
    <div class="panel-placeholder" v-else>
      {{ panelLabel }} — editing panel coming in Stage 5+
    </div>
  </div>

  <!-- Hidden file input — must be inside #app for Vue to bind @change -->
  <input type="file" id="file-input" accept=".json" style="display:none" @change="onFileSelected">

</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<script type="module" src="./4t-wizard/wizard.js"></script>

</body>
</html>
